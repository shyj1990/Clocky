name: Build Clocky unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          ls /Applications | grep -i xcode || true
          if [ -d "/Applications/Xcode_27.3.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_27.3.app/Contents/Developer"
          else
            for d in /Applications/Xcode_27*.app /Applications/Xcode.app; do
              if [ -d "$d" ]; then sudo xcode-select -s "$d/Contents/Developer"; break; fi
            done
          fi
          xcodebuild -version

      - name: Build iPhone app + embedded Watch app (no signing, weak-linked private frameworks)
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/DerivedData"
          WEAKFLAGS='OTHER_LDFLAGS[sdk=watchos*]=$(inherited) -weak_framework WatchKit -weak_framework NanoTimeKit -weak_framework PepperUICore -weak_framework ClockKit -weak_framework _UIKitPrivate'
          xcodebuild \
            -project Clocky.xcodeproj \
            -scheme ClockyCompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived" \
            COMPANION_BUNDLE_IDENTIFIER="com.example.Clocky" \
            "$WEAKFLAGS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ClockyCompanion.app"
          test -d "$app"
          test -d "$app/Watch"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" build/ipa
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/ClockyCompanion.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" build/ipa/Clocky.ipa
          ls -la build/ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clocky-weaklink-ipa
          path: build/ipa/Clocky.ipa
